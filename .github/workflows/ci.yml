name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend CI
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      JWT_SECRET: ci-only-not-a-production-secret
      # Mocked tests cannot reach a DB here; integration harnesses own fresh local clusters.
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:1/ci_never_connected
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Set up Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Client IP security regressions (isolated)
        run: npm run test
      - name: Health checks (mocked Prisma)
        run: npm run test:health-checks
      - name: Registration validation and security (disposable local PostgreSQL)
        run: npm run test:register-validation
      - name: Tracking preview (mocked Prisma)
        run: npm run test:tracking-preview
      - name: Tracking preview rate limiting (mocked Prisma)
        run: npm run test:tracking-preview-rate-limit
      - name: Tracking token and expiry unit tests
        run: node node_modules/tsx/dist/cli.mjs tests/tracking-links-unit.ts
      - name: Public API origin (mocked Prisma)
        run: npm run test:public-api-origin
      - name: Tenant isolation (disposable local PostgreSQL)
        run: npm run test:tenant-isolation-complete
      - name: Personal theme preference (disposable local PostgreSQL)
        run: npm run test:profile-theme
      - name: Equipment deletion and accounting (disposable local PostgreSQL)
        run: npm run test:equipment-delete
      - name: Repair hard deletion on main (disposable local PostgreSQL)
        run: npm run test:repair-hard-delete
      - name: Removed cancellation endpoints (disposable local PostgreSQL)
        run: npm run test:repair-cancellation-removal
      - name: Guarded cancellation migration (disposable local PostgreSQL)
        run: npm run test:repair-cancellation-migration
      - name: Role and permission authorization (disposable local PostgreSQL)
        run: npm run test:role-permissions-complete
      - name: Sessions and JWT security (disposable local PostgreSQL)
        run: npm run test:session-security
      - name: Browser hardening and stored fields (disposable local PostgreSQL)
        run: npm run test:browser-hardening
      - name: Install PostgreSQL 17 tools for disposable recovery test
        run: |
          curl --fail --silent --show-error https://www.postgresql.org/media/keys/ACCC4CF8.asc -o /tmp/pgdg.asc
          sudo install -m 644 /tmp/pgdg.asc /usr/share/keyrings/pgdg.asc
          echo "deb [signed-by=/usr/share/keyrings/pgdg.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo mkdir -p /etc/postgresql-common
          echo "create_main_cluster = false" | sudo tee /etc/postgresql-common/createcluster.conf >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-17 postgresql-client-17
      - name: Encrypted backup and restore (owned disposable PostgreSQL 17 only)
        env:
          PG_BIN: /usr/lib/postgresql/17/bin
        run: npm run test:backup
      - name: Streaming backup, strict TLS and recovery over 128 MiB (synthetic local cluster only)
        env:
          PG_BIN: /usr/lib/postgresql/17/bin
        run: npm run test:backup-stream

  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_API_URL: http://127.0.0.1:3000
      PREMIUM_FINAL_OUTPUT_DIR: ${{ github.workspace }}/artifacts/mobile-ux/financial-checks
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Set up Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Equipment list, details and deletion (mocked services)
        run: npm run test:equipment-sales
      - name: Repair flow (mocked services)
        run: npm run test:repair-flow
      - name: Repair hard deletion (mocked services)
        run: npm run test:repair-hard-delete
      - name: Repair editing (mocked services)
        run: npm run test:repair-edit
      - name: Cash groups (local component harness)
        run: npm run test:cash-groups
      - name: Platform admin metrics (mocked hooks)
        run: npm run test:platform-admin-metrics
      - name: Renewal UI contract
        run: npm run test:expired-owner-renewal-ui
      - name: Encoding
        run: npm run test:encoding
      - name: PWA (mocked browser and fetch)
        run: npm run test:pwa
      - name: API domain preparation (offline)
        run: npm run test:api-domain-prep
      - name: Install Chromium for isolated browser tests
        run: npx playwright install --with-deps chromium
      - name: Registration validation (real form, synthetic API and Turnstile)
        env:
          REGISTER_SCREENSHOTS: ${{ github.workspace }}/artifacts/registration
        run: npm run test:register-validation
      - name: Mobile carousel native interactions and preserved settings drafts
        run: npm run test:mobile-carousel && npm run test:mobile-settings && npm run test:mobile-workflows
      - name: Mobile UX routes (both themes, synthetic API)
        env:
          MOBILE_UX_PHASES: after
          MOBILE_UX_DIAGNOSTICS: 'true'
          MOBILE_UX_VIEWPORTS: '360,390,430,768,1440'
          MOBILE_UX_SCREENS: dashboard,cash,cash-repairs,cash-equipment,equipment,settings,commerce,pos,dashboard-limited,commerce-limited
        run: npm run test:mobile-ux
      - name: Tablet native gesture regression (three repetitions, no skipped routes)
        run: node tests/mobile-native-touch-regression.cjs
      - name: Personal preference, sessions and nested themes (real React, mocked API)
        run: npm run test:theme-preference
      - name: Full visual themes desktop and mobile (real App, mocked API)
        env:
          PREMIUM_THEME_VIEWPORTS: desktop,mobile
        run: npm run test:premium-theme
      - name: Final logo and financial colors (desktop, 390px, 360px; synthetic API)
        run: npm run test:premium-final-visual
      - name: Equipment responsive UI and deletion (real React, mocked API)
        run: npm run test:equipment-browser
      - name: Session restoration and cross-tab revocation (real React, mocked API)
        run: npm run test:session-security
      - name: Account deletion UI (real React, mocked API)
        run: npm run test:account-deletion
      - name: XSS rendering and recovery URL (real React, mocked API)
        run: npm run test:browser-hardening
      - name: Compiled CSP compatibility (isolated resource fixtures)
        run: npm run test:csp-compatibility
      - name: Upload mobile browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mobile-browser-${{ github.run_id }}
          path: |
            artifacts/mobile-ux
            artifacts/registration
          retention-days: 14
